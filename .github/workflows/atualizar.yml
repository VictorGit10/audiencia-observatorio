name: Atualizar dados

on:
  schedule:
    - cron: '0 9 * * *'   # todo dia às 06:00 de Brasília
  workflow_dispatch:      # botão "Run workflow" para atualizar na hora

permissions:
  contents: write

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Coletar dados do GA4
        run: node ga.mjs
        env:
          GA_CREDENTIALS: ${{ secrets.GA_CREDENTIALS }}
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data.js snapshots
          git diff --cached --quiet && exit 0
          git commit -m "dados: $(TZ=America/Sao_Paulo date +%F)"
          git push
